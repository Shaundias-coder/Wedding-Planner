<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ===== Shared website configuration =====
const SUPABASE_URL='https://vatplngxkwsngliveikm.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_vec8fuFPIeOkKEsQnkoyAQ_geISQmYV';
let SB=null,SESSION=null,CAN_EDIT=false,IS_ADMIN=false,realtime=null;
const SUPABASE_READY=()=>typeof window.supabase!=='undefined' && SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('PASTE_') && !SUPABASE_ANON_KEY.includes('PASTE_');
const showAuth=(on=true)=>$('#authModal').classList.toggle('on',on);
const showAccess=(on=true)=>{$('#accessModal').classList.toggle('on',on);if(on)loadEditors()};
const setAuthMsg=t=>$('#authMsg').textContent=t||'';
const setAccessMsg=t=>$('#accessMsg').textContent=t||'';
async function refreshAccess(){
  if(!SB){
    SESSION=null;
    CAN_EDIT=false;
    IS_ADMIN=false;
    updateAuthUI();
    return;
  }

  const {data:{session}} = await SB.auth.getSession();

  SESSION = session || null;
  CAN_EDIT = false;
  IS_ADMIN = false;

  if(SESSION?.user?.id){
    const {data:profile, error} = await SB
      .from('planner_users')
      .select('id, username, role, active')
      .eq('id', SESSION.user.id)
      .eq('active', true)
      .maybeSingle();

    if(!error && profile){
      SESSION.plannerProfile = profile;

      CAN_EDIT = profile.role === 'admin' || profile.role === 'editor';
      IS_ADMIN = profile.role === 'admin';
    }
  }

  updateAuthUI();
}
function updateAuthUI(){
  const badge=$('#authBadge');
  const name=$('#authName');
  const btn=$('#authBtn');
  const access=$('#accessBtn');

  document.body.classList.toggle('editor',CAN_EDIT);

  if(SESSION){
    const profile=SESSION.plannerProfile;
    const username=profile?.username || SESSION.user?.email || 'Signed in';

    badge.className='authbadge '+(CAN_EDIT?'editor':'viewer');
    badge.textContent=CAN_EDIT
      ? (IS_ADMIN?'ADMIN · EDITOR':'EDITOR')
      : 'VIEW ONLY';

    name.textContent=username;
    btn.textContent='🔓 Sign out';

    if(access) access.style.display=IS_ADMIN?'inline-block':'none';
  }else{
    badge.className='authbadge viewer';
    badge.textContent='VIEW ONLY';
    name.textContent='Public access';
    btn.textContent='🔐 Sign in';

    if(access) access.style.display='none';
  }
}
async function signIn(){   if(!SB)return setAuthMsg('Finish the Supabase setup first.');    const username=$('#authUsername').value.trim().toLowerCase();   const password=$('#authPassword').value;    if(!username||!password)     return setAuthMsg('Enter your username and password.');    setAuthMsg('Signing in…');    const {data,error}=await SB.functions.invoke('username-login',{     body:{username,password}   });    if(error||!data?.session)     return setAuthMsg(data?.error||error?.message||'Invalid username or password.');    const {error:sessionError}=await SB.auth.setSession({     access_token:data.session.access_token,     refresh_token:data.session.refresh_token   });    if(sessionError)     return setAuthMsg(sessionError.message);    setAuthMsg('Signed in.');   showAuth(false);    await refreshAccess();   await loadShared();   render(); }
async function signUp(){if(!SB)return setAuthMsg('Finish the Supabase setup first.');const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||password.length<6)return setAuthMsg('Enter a valid email and a password of at least 6 characters.');setAuthMsg('Creating account…');const {error}=await SB.auth.signUp({email,password});if(error)return setAuthMsg(error.message);setAuthMsg('Account created. Verify your email if required, then sign in. An admin must still approve edit access.');}
async function signOut(){if(SB)await SB.auth.signOut();SESSION=null;CAN_EDIT=false;IS_ADMIN=false;updateAuthUI();showAccess(false);render();}
async function loadShared(){if(!SB)return;stat('Loading shared planner…');const {data,error}=await SB.from('planner_data').select('data').eq('id','main').maybeSingle();if(error){stat('⚠ Shared data unavailable: '+error.message);return}if(data?.data){D=data.data;fill();try{localStorage.setItem('wp-mcw2',JSON.stringify(D))}catch(e){}stat(CAN_EDIT?'● Shared · editor':'● Shared · view only')}else{stat(CAN_EDIT?'● Ready to publish planner':'● Waiting for planner data');if(CAN_EDIT)await save(true)}}
async function save(force=false){try{localStorage.setItem('wp-mcw2',JSON.stringify(D))}catch(e){}if(!SB||!CAN_EDIT){if(!SB)stat('Local only · finish Supabase setup to share');return}clearTimeout(tmr);tmr=setTimeout(async()=>{stat('Saving shared planner…');const {error}=await SB.from('planner_data').upsert({id:'main',data:JSON.parse(JSON.stringify(D)),updated_at:new Date().toISOString()},{onConflict:'id'});stat(error?'⚠ Save failed: '+error.message:'● Saved & shared')},700)}
async function subscribeShared(){if(!SB||realtime)return;realtime=SB.channel('planner-live').on('postgres_changes',{event:'*',schema:'public',table:'planner_data',filter:'id=eq.main'},payload=>{if(!payload.new?.data)return;if(JSON.stringify(payload.new.data)===JSON.stringify(D))return;D=payload.new.data;fill();try{localStorage.setItem('wp-mcw2',JSON.stringify(D))}catch(e){}if(!showForm)render();stat(CAN_EDIT?'● Synced':'● Updated')}).subscribe()}
async function loadEditors(){
  if(!SB || !IS_ADMIN) return;

  const {data,error}=await SB.functions.invoke('manage-planner-users',{
    body:{action:'list'}
  });

  const el=$('#accessList');

  if(error){
    el.textContent=error.message;
    return;
  }

  const users=data?.users||[];

  el.innerHTML=users.map(x=>`
    <div class="accessrow">
      <span>
        <b>${esc(x.username)}</b> · ${esc(x.role)} · ${x.active?'Active':'Inactive'}
      </span>

      <span style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="authbtn"
          data-user-role="${esc(x.id)}"
          data-role="${x.role==='admin'?'editor':'admin'}">
          ${x.role==='admin'?'Make editor':'Make admin'}
        </button>

        <button class="authbtn"
          data-user-active="${esc(x.id)}"
          data-active="${x.active?'0':'1'}">
          ${x.active?'Disable':'Enable'}
        </button>

        <button class="authbtn danger"
          data-reset-user="${esc(x.id)}">
          Reset password
        </button>

        <button class="authbtn danger"

        :'';

  h+=`<div class="bulk">

    <input
      id="guestSearch"
      type="search"
      placeholder="🔎 Search guests..."
      value="${esc(guestSearch)}"
      style="min-width:230px;flex:1;max-width:320px"
    >

    <label class="tag" style="cursor:pointer">
      <input type="checkbox" id="selall" ${all?'checked':''}>
      ☑ Select all (${items.length})
    </label>

    <span class="sub">
      ${n} selected · showing ${items.length} of ${D.guests.length}${filterLabel}
    </span>

    <span style="flex:1"></span>

    <button class="chip" ${dis} data-bulk="sent">
      ✓ Mark sent
    </button>

    <button class="chip" ${dis} data-bulk="unsent">
      ○ Mark not sent
    </button>

    <button class="chip" ${dis} data-bulk="del" style="color:var(--warn)">
      🗑 Delete
    </button>

  </div>`}
if(!items.length)return h+'<div class="empty">No guests yet. Tap “Add”.</div>';
return h+items.map(({it,i})=>`<div class="card"><div class="top"><div style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" data-gs="${i}" ${selG.has(it)?'checked':''} style="margin-top:4px;width:18px;height:18px"><div><div class="t">${esc(it.name)}</div>${it.addr?`<div class="sub">📍 ${esc(it.addr)}</div>`:''}</div></div><span style="white-space:nowrap">${mv('guests',i)}<button class="x" data-edit="guests" data-i="${i}" title="Edit">✎</button><button class="x" data-del="guests" data-i="${i}" title="Delete">×</button></span></div>
<div class="meta"><span class="tag gold">${it.side==='Mutual'&&it.remark?'Mutual – '+esc(it.remark):it.side+' side'}</span>${it.phone?`<span class="tag">${esc(it.phone)}</span>`:''}<label class="tag" style="cursor:pointer"><input type="checkbox" data-sec="guests" data-i="${i}" data-k="sent" ${it.sent?'checked':''}> ✉ Invitation sent</label></div>
${GEV.filter(e=>it.inv[e]&&(flt==='All'||flt===e)).map(e=>`<div class="meta"><b style="min-width:120px">${L[e]}</b><select data-g="${i}" data-e="${e}" data-r="1">${RS.map(r=>`<option ${r===it.inv[e].rsvp?'selected':''}>${r}</option>`).join('')}</select><input type="number" min="1" data-g="${i}" data-e="${e}" value="${it.inv[e].n}"> guests</div>`).join('')}</div>`).join('')}
function evd(){return grp().map(e=>{const d=D.evd[e]||{};return `<div class="ev"><h3>${L[e]} – details</h3><div class="form" style="border:0;padding:0;margin:6px 0 0">${[['date','Date','date'],['time','Start time','time'],['venue','Venue','text'],['addr','Address','text'],['contact','Contact person','text']].map(([k,l,t])=>`<label>${l}<input type="${t}" data-evd="${e}" data-k="${k}" value="${esc(d[k]||'')}"></label>`).join('')}<label class="full">Notes (dress code, parking…)<textarea rows="2" data-evd="${e}" data-k="notes">${esc(d.notes||'')}</textarea></label></div></div>`}).join('')}
function list(sec){const s=S[sec];let items=D[sec].map((it,i)=>({it,i}));
if(sec==='guests')items=items.filter(x=>gIn(x.it));else items=items.filter(x=>inEv(x.it));
if(sec==='itin')items.sort((a,b)=>ALL.indexOf(a.it.ev)-ALL.indexOf(b.it.ev));
if(sec==='menu')items.sort((a,b)=>S.menu.f[2].o.indexOf(a.it.course)-S.menu.f[2].o.indexOf(b.it.course));
let h=`<h2>${s.t}</h2><div class="chips">${['All','Roce','Wedding'].filter(c=>!(sec==='itin'&&c==='All')).map(e=>`<button class="chip ${flt===e?'on':''}" data-flt="${e}">${e}</button>`).join('')}<span style="flex:1"></span><button class="add" data-add>＋ Add</button></div>`;
if(sec==='itin')h+=evd()+'<h4>Chronology of events <button class="chip" data-sorttime style="margin-left:8px">⇅ Sort by time</button></h4>';
if(sec==='guests')return h+guests(items);
if(showForm)h+=`<div class="form">${s.f.map(x=>inp(x,sec)).join('')}<button class="add full" data-save>${ed!==null?'✓ Update':'Save'}</button>${ed!==null?'<button class="chip full" data-cancel>Cancel</button>':''}</div>`;
if(sec==='vendors'){const a=items.reduce((s,x)=>s+ +x.it.total,0),p=items.reduce((s,x)=>s+ +x.it.paid,0);h+=`<div class="stat"><b>${m(a-p)} <small style="font-size:14px;color:var(--mut)">due</small></b><span>Total ${m(a)} · Advance/paid ${m(p)}</span><div class="bar"><i style="width:${a?100*p/a:0}%"></i></div></div>`}
if(sec==='gifts')h+=`<div class="stat"><b>${m(items.reduce((s,x)=>s+ +x.it.value,0))}</b><span>${items.length} gifts · ${items.filter(x=>!x.it.thanked).length} thank-yous pending</span></div>`;
if(!items.length)return h+'<div class="empty">Nothing here yet. Tap “Add”.</div>';
if(sec==='itin'){   let last='';   items.forEach(({it,i})=>{     if(it.ev!==last){       h+=`${last?'</div>':''}<h4 style="color:var(--gold)">${L[it.ev]}</h4><div class="tl">`;       last=it.ev;     }      h+=`<div class="card">       <div class="top">         <div>           <span class="tag gold">${esc(it.time||'')}</span>           <span class="t">${esc(it.activity||it.what||'')}</span>           ${it.description||it.where             ? `<div class="sub">${esc(it.description||it.where)}</div>`             : ''}         </div>         <span style="white-space:nowrap">           ${mv('itin',i)}           <button class="x" data-edit="itin" data-i="${i}" title="Edit">✎</button>           <button class="x" data-del="itin" data-i="${i}" title="Delete">×</button>         </span>       </div>     </div>`;   });    return h+'</div>'; }
return h+items.map(({it,i})=>{let st='';if(sec==='vendors'){const b=it.total-it.paid;st=it.settled?`<span class="tag ok">✔ Bill settled</span><input type="date" data-sec="vendors" data-i="${i}" data-k="settledOn" value="${it.settledOn||''}" title="Date of settlement">`:it.total?(b<=0?'<span class="tag ok">Paid in full</span>':`<span class="tag warn">Balance ${m(b)}</span>`):''}
return `<div class="card ${sec==='todo'&&it.done?'done':''}"><div class="top"><div class="t">${esc(it[s.f[0].k])}</div><span style="white-space:nowrap">${['todo','notes'].includes(sec)?mv(sec,i):''}${sec==='vendors'?`<label class="x" title="Attach invoice / receipt" style="cursor:pointer">📎<input type="file" hidden multiple accept="image/*,application/pdf" data-up="${i}"></label>`:''}<button class="x" data-edit="${sec}" data-i="${i}" title="Edit">✎</button><button class="x" data-del="${sec}" data-i="${i}" title="Delete">×</button></span></div>${sec==='notes'?`<div class="sub" style="white-space:pre-wrap;margin-top:4px">${esc(it.text)}</div>`:''}<div class="meta">${s.f.slice(1).map(x=>field(x,it,i,sec)).join('')}${st}</div>${sec==='vendors'?att(it,i):''}</div>`}).join('')}
const toggleRem=()=>{const w=$('#g_rem_w'),sd=$('#g_side');if(w&&sd)w.style.display=sd.value==='Mutual'?'':'none'};
function tick(){document.querySelectorAll('[data-cd]').forEach(el=>{const t=window.CDT&&window.CDT[el.dataset.cd];if(!t||isNaN(t)){el.textContent='Set date in Itinerary';return}const ms=t-new Date();if(ms<=0){el.textContent='🎉 Underway / done';return}el.textContent=Math.floor(ms/36e5)%24+'h '+Math.floor(ms/6e4)%60+'m '+Math.floor(ms/1e3)%60+'s'})}
setInterval(()=>{if(tab==='home')tick()},1000);
function fillForm(){const it=D[tab][ed];if(!it)return;
if(tab==='guests'){$('#f_name').value=it.name;$('#g_side').value=it.side;$('#f_remark').value=it.remark||'';toggleRem();$('#f_phone').value=it.phone||'';$('#f_addr').value=it.addr||'';$('#g_sent').checked=!!it.sent;GEV.forEach(e=>{const v=it.inv[e];$('#g_on_'+e).checked=!!v;$('#g_n_'+e).value=v?v.n:1})}
else S[tab].f.forEach(f=>{const el=$('#f_'+f.k);if(!el)return;if(f.t==='bool')el.checked=!!it[f.k];else el.value=it[f.k]??''});
const fm=$('.form');if(fm)fm.scrollIntoView({behavior:'smooth',block:'center'})}
function render(){nav();$('#app').innerHTML=tab==='home'?home():list(tab);if(showForm&&ed!==null)fillForm();if(tab==='home')tick();
$('#n1').value=D.a;$('#n2').value=D.b;$('#dt').value=D.date;$('#cur').value=D.cur}
document.addEventListener('click',e=>{const t=e.target,d=t.dataset;if(d.userRole){   const role=d.role;   SB.functions.invoke('manage-planner-users',{     body:{action:'set_role',id:d.userRole,role}   }).then(({data,error})=>{     if(error){       setAccessMsg(data?.error||error.message);       return;     }     loadEditors();   });   return; }  if(d.userActive){   SB.functions.invoke('manage-planner-users',{     body:{       action:'set_active',       id:d.userActive,       active:d.active==='1'     }   }).then(({data,error})=>{     if(error){       setAccessMsg(data?.error||error.message);       return;     }     loadEditors();   });   return; }  if(d.resetUser){   const p=prompt('Enter a new password (at least 8 characters):');   if(p===null)return;   if(p.length<8){     setAccessMsg('Password must be at least 8 characters.');     return;   }    SB.functions.invoke('manage-planner-users',{     body:{       action:'reset_password',       id:d.resetUser,       password:p     }   }).then(({data,error})=>{     if(error){       setAccessMsg(data?.error||error.message);       return;     }     setAccessMsg('Password reset successfully.');   });   return; }  if(d.deleteUser){   if(!confirm('Delete this planner user permanently?'))return;    SB.functions.invoke('manage-planner-users',{     body:{       action:'delete',       id:d.deleteUser     }   }).then(({data,error})=>{     if(error){       setAccessMsg(data?.error||error.message);       return;     }     loadEditors();   });   return; }if(!CAN_EDIT&&(d.edit||d.del||d.mv||d.bulk||('save' in d)||('add' in d)||d.sorttime||('cancel' in d)||d.rmf!==undefined))return;
if(d.guestFilter){   tab='guests';   guestStatusFilter=d.guestFilter;   guestSearch='';   selG.clear();   showForm=false;   ed=null;   sf='All';   flt='All';   render();   return; }  if(d.tab){   tab=d.tab;   flt=tab==='itin'?'Roce':'All';   sf='All';    if(tab==='guests'){     guestStatusFilter='all';     guestSearch='';     selG.clear();   }    showForm=false;   ed=null; }
else if(d.edit){tab=d.edit;ed=+d.i;showForm=true;if(tab==='itin')flt=EV.Roce.includes(D.itin[ed].ev)?'Roce':'Wedding'}
else if('cancel' in d){showForm=false;ed=null}
else if(d.mv){move(d.mv,+d.i,+d.dir);save()}
else if(d.bulk){const A=D.guests,SS=A.filter(g=>selG.has(g));if(!SS.length)return;
if(d.bulk==='del'){if(!confirm('Delete '+SS.length+' selected invites?'))return;D.guests=A.filter(g=>!selG.has(g));selG.clear()}
else if(d.bulk==='sent'||d.bulk==='unsent')SS.forEach(g=>g.sent=d.bulk==='sent');
else{const idx=A.map((g,k)=>k).filter(k=>gIn(A[k])&&(sf==='All'||A[k].side===sf)),V=idx.map(k=>A[k]),n=V.length,sw=(a,b)=>{[V[a],V[b]]=[V[b],V[a]]};
if(d.bulk==='up'){for(let j=1;j<n;j++)if(selG.has(V[j])&&!selG.has(V[j-1]))sw(j,j-1)}else{for(let j=n-2;j>=0;j--)if(selG.has(V[j])&&!selG.has(V[j+1]))sw(j,j+1)}
idx.forEach((k,j)=>A[k]=V[j])}
save()}
else if('sorttime' in d){D.itin.sort((a,b)=>a.time.localeCompare(b.time));save()}
else if(d.rmf!==undefined){if(!confirm('Remove this attachment?'))return;const f=D.vendors[+d.rmf].files.splice(+d.j,1)[0];try{AS&&AS.delete(f.id)}catch(x){}save()}
else if(d.flt){flt=d.flt;showForm=false;ed=null}
else if(d.sf)sf=d.sf;
else if('add' in d){showForm=!showForm;ed=null}
else if(d.del){if(!confirm('Delete this entry?'))return;D[d.del].splice(+d.i,1);save()}
else if('save' in d){let o={};
if(tab==='guests'){o={name:$('#f_name').value,side:$('#g_side').value,remark:$('#g_side').value==='Mutual'?$('#f_remark').value.trim():'',phone:$('#f_phone').value,addr:$('#f_addr').value,sent:$('#g_sent').checked,inv:{}};GEV.forEach(e=>{if($('#g_on_'+e).checked)o.inv[e]={rsvp:(ed!==null&&D.guests[ed].inv[e]?D.guests[ed].inv[e].rsvp:'Pending'),n:Math.max(1,+$('#g_n_'+e).value||1)}});if(!Object.keys(o.inv).length)return alert('Tick at least one event.')}
else S[tab].f.forEach(f=>o[f.k]=f.t==='bool'?$('#f_'+f.k).checked:f.t==='num'?(+$('#f_'+f.k).value||0):$('#f_'+f.k).value);
if(!String(o[S[tab].f[0]?.k||'name']||'').trim())return alert('Please fill in the first field.');
if(tab==='items')o.status=o.status||'Needed';if(tab==='vendors'){const old=ed!==null?D.vendors[ed]:{};if(o.settled){o.settledOn=old.settledOn||new Date().toISOString().slice(0,10);o.paid=o.total}else o.settledOn=''}if(ed!==null)D[tab][ed]={...D[tab][ed],...o};else D[tab].push(o);showForm=false;ed=null;save()}
else return;render()});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(!CAN_EDIT&&(d.sec||d.g||d.evd||d.up!==undefined||d.gs!==undefined||t.id==='selall'||t.id==='g_side'||t.id==='xl'))return;
if(d.gs!==undefined){const g=D.guests[+d.gs];t.checked?selG.add(g):selG.delete(g);render();return}
if(t.id==='selall'){D.guests.filter(g=>gIn(g)&&(sf==='All'||g.side===sf)).forEach(g=>t.checked?selG.add(g):selG.delete(g));render();return}
if(t.id==='g_side'){toggleRem();return}
if(t.id==='xl'){importXL(t.files[0]);t.value='';return}
if(d.up!==undefined){upload(+d.up,[...t.files]);t.value='';return}
if(d.g!==undefined){D.guests[+d.g].inv[d.e][d.r?'rsvp':'n']=t.value;save();render()}
else if(d.evd){(D.evd[d.evd]=D.evd[d.evd]||{})[d.k]=t.value;save()}
else if(d.sec){D[d.sec][+d.i][d.k]=t.type==='checkbox'?t.checked:t.value;if(d.sec==='vendors'&&d.k==='settled'){const v=D.vendors[+d.i];if(v.settled){v.settledOn=v.settledOn||new Date().toISOString().slice(0,10);v.paid=v.total}else v.settledOn=''}save();render()}});

document.addEventListener('input',e=>{
  if(e.target.id==='guestSearch'){
    guestSearch=e.target.value;
    render();

    const input=$('#guestSearch');
    if(input){
      input.focus();
      input.setSelectionRange(
        input.value.length,
        input.value.length
      );

});
[['n1','a'],['n2','b'],['dt','date'],['cur','cur']].forEach(([id,k])=>$('#'+id).addEventListener('input',e=>{if(!CAN_EDIT)return;D[k]=e.target.value;save();if(tab==='home')render()}));
document.addEventListener('focusout',()=>{if(pend&&!showForm){pend=false;render()}});
(async()=>{if(!SUPABASE_READY()){$('#setupNote').style.display='block';$('#setupNote').textContent='Setup needed: create a Supabase project and paste its Project URL + Publishable/anon key into index.html. Until then this planner remains local-only.';updateAuthUI();return}SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);SB.auth.onAuthStateChange(async()=>{await refreshAccess()});await refreshAccess();await loadShared();await subscribeShared();render()})();
window.addEventListener('DOMContentLoaded',()=>{
  $('#authBtn')?.addEventListener('click',()=>SESSION?signOut():showAuth(true));
  $('#closeAuth')?.addEventListener('click',()=>showAuth(false));
  $('#signInBtn')?.addEventListener('click',signIn);
  $('#authModal')?.addEventListener('click',e=>{if(e.target.id==='authModal')showAuth(false)});
  $('#accessBtn')?.addEventListener('click',()=>showAccess(true));
  $('#closeAccess')?.addEventListener('click',()=>showAccess(false));

});
